<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DesiMart Jharkhand</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #ff6b00;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #ff6b00;
      color: white;
      font-size: 16px;
    }

    .hidden {
      display: none;
    }

    .product {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 10px;
      border-radius: 10px;
    }

    .logout {
      background: #333;
    }

    #message {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>DesiMart Jharkhand</h1>
  <p>Jharkhand ka apna online market</p>
</header>

<div class="container">

  <div id="authSection">

    <div class="card">
      <h2>Customer Registration</h2>

      <input id="regName" type="text" placeholder="Apna naam">
      <input id="regMobile" type="tel" placeholder="Mobile number">
      <input id="regPassword" type="password" placeholder="Password">

      <button onclick="registerCustomer()">Register</button>
    </div>

    <div class="card">
      <h2>Customer Login</h2>

      <input id="loginMobile" type="tel" placeholder="Mobile number">
      <input id="loginPassword" type="password" placeholder="Password">

      <button onclick="loginCustomer()">Login</button>
    </div>

  </div>

  <div id="message"></div>

  <div id="dashboard" class="hidden">

    <div class="card">
      <h2>Welcome, <span id="customerName"></span> 👋</h2>
      <p>DesiMart Jharkhand में आपका स्वागत है।</p>

      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="card">
      <h2>🛍️ Products</h2>

      <div id="products">
        Products loading...
      </div>
    </div>

    <div class="card">
      <h2>🛒 Cart</h2>

      <div id="cart">
        Your cart is empty.
      </div>
    </div>

    <div class="card">
      <h2>📦 My Orders</h2>

      <p>अभी कोई order नहीं है।</p>
    </div>

  </div>

</div>

<script>

const API = "https://desimart-jharkhand.onrender.com";

async function registerCustomer() {

  const name = document.getElementById("regName").value;
  const mobile = document.getElementById("regMobile").value;
  const password = document.getElementById("regPassword").value;

  try {

    const response = await fetch(API + "/api/users", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        mobile,
        password,
        role: "customer"
      })
    });

    const data = await response.json();

    document.getElementById("message").innerText =
      data.error || "Registration successful!";

  } catch (error) {

    document.getElementById("message").innerText =
      "Server se connection nahi ho raha.";

  }
}

async function loginCustomer() {

  const mobile = document.getElementById("loginMobile").value;
  const password = document.getElementById("loginPassword").value;

  try {

    const response = await fetch(API + "/api/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        mobile,
        password
      })
    });

    const data = await response.json();

    if (data.success) {

      document.getElementById("authSection").classList.add("hidden");

      document.getElementById("dashboard").classList.remove("hidden");

      document.getElementById("customerName").innerText =
        data.user.name;

      document.getElementById("message").innerText =
        "Login successful!";

      loadProducts();

    } else {

      document.getElementById("message").innerText =
        data.error || "Login failed.";

    }

  } catch (error) {

    document.getElementById("message").innerText =
      "Server se connection nahi ho raha.";

  }
}

async function loadProducts() {

  try {

    const response = await fetch(API + "/api/products");

    const products = await response.json();

    const box = document.getElementById("products");

    box.innerHTML = "";

    products.forEach(product => {

      const div = document.createElement("div");

      div.className = "product";

      div.innerHTML = `
        <h3>${product.name}</h3>
        <p>₹${product.price}</p>
        <p>Stock: ${product.stock}</p>
        <p>Category: ${product.category}</p>
      `;

      box.appendChild(div);

    });

  } catch (error) {

    document.getElementById("products").innerText =
      "Products load nahi ho rahe.";

  }
}

function logout() {

  document.getElementById("dashboard").classList.add("hidden");

  document.getElementById("authSection").classList.remove("hidden");

  document.getElementById("message").innerText =
    "Logout successful.";

}

</script>

</body>
</html>
