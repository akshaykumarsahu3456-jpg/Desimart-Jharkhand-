<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DesiMart Jharkhand</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #ff6b00;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #ff6b00;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .product {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 10px;
      border-radius: 10px;
      background: #fff;
    }

    .cart-item {
      border: 1px solid #ddd;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
    }

    .small-btn {
      width: auto;
      padding: 7px 12px;
      margin: 4px;
    }

    .logout {
      background: #333;
    }

    .danger {
      background: #d32f2f;
    }

    #message {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>DesiMart Jharkhand</h1>
  <p>Jharkhand ka apna online market</p>
</header>

<div class="container">

  <!-- LOGIN / REGISTER -->

  <div id="authSection">

    <div class="card">
      <h2>Customer Registration</h2>

      <input id="regName" type="text" placeholder="Apna naam">
      <input id="regMobile" type="tel" placeholder="Mobile number">
      <input id="regPassword" type="password" placeholder="Password">

      <button type="button" onclick="registerCustomer()">
        Register
      </button>
    </div>

    <div class="card">
      <h2>Customer Login</h2>

      <input id="loginMobile" type="tel" placeholder="Mobile number">
      <input id="loginPassword" type="password" placeholder="Password">

      <button type="button" onclick="loginCustomer()">
        Login
      </button>
    </div>

  </div>

  <div id="message"></div>

  <!-- DASHBOARD -->

  <div id="dashboard" class="hidden">

    <div class="card">
      <h2>
        Welcome, <span id="customerName"></span> 👋
      </h2>

      <p>DesiMart Jharkhand में आपका स्वागत है।</p>

      <button type="button" class="logout" onclick="logout()">
        Logout
      </button>
    </div>

    <!-- PRODUCTS -->

    <div class="card">
      <h2>🛍️ Products</h2>

      <div id="products">
        Products loading...
      </div>
    </div>

    <!-- CART -->

    <div class="card">
      <h2>🛒 My Cart</h2>

      <div id="cart">
        Your cart is empty.
      </div>

      <div id="cartTotal" class="total"></div>

      <button
        type="button"
        id="checkoutButton"
        class="hidden"
        onclick="checkout()">
        Checkout
      </button>
    </div>

    <!-- ORDERS -->

    <div class="card">
      <h2>📦 My Orders</h2>
      <p>अभी कोई order नहीं है।</p>
    </div>

  </div>

</div>

<script>

const API = "https://desimart-jharkhand.onrender.com";


/* =========================
   MESSAGE
========================= */

function showMessage(text) {
  document.getElementById("message").innerText = text;
}


/* =========================
   REGISTER
========================= */

async function registerCustomer() {

  const name =
    document.getElementById("regName").value.trim();

  const mobile =
    document.getElementById("regMobile").value.trim();

  const password =
    document.getElementById("regPassword").value;

  if (!name || !mobile || !password) {
    showMessage("Naam, mobile aur password bhariye.");
    return;
  }

  try {

    const response = await fetch(API + "/api/users", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        name: name,
        mobile: mobile,
        password: password,
        role: "customer"
      })
    });
alert("Server response aa gaya: " + response.status);
    const data = await response.json();

    if (!response.ok) {
      showMessage(data.error || "Registration failed.");
      return;
    }

    showMessage("Registration successful! Ab login kijiye.");

    document.getElementById("regName").value = "";
    document.getElementById("regMobile").value = "";
    document.getElementById("regPassword").value = "";

  } catch (error) {

    showMessage("Server se connection nahi ho raha.");

  }
}


/* =========================
   LOGIN
========================= */

async function loginCustomer() {

  const mobile =
    document.getElementById("loginMobile").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  if (!mobile || !password) {
    showMessage("Mobile aur password bhariye.");
    return;
  }

  try {

    const response = await fetch(API + "/api/login", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        mobile: mobile,
        password: password
      })
    });

    const data = await response.json();

    if (!response.ok || !data.success) {

      showMessage(data.error || "Login failed.");
      return;
    }

    localStorage.setItem(
      "desimartUser",
      JSON.stringify(data.user)
    );

    document
      .getElementById("authSection")
      .classList.add("hidden");

    document
      .getElementById("dashboard")
      .classList.remove("hidden");

    document.getElementById("customerName").innerText =
      data.user.name;

    showMessage("Login successful!");

    loadProducts();
    loadCart();

    } catch (error) {

    alert("ERROR: " + error.message);

    showMessage(
      "Cart server se connect nahi ho raha."
    );

  }


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts() {

  const box =
    document.getElementById("products");

  box.innerText = "Products loading...";

  try {

    const response =
      await fetch(API + "/api/products");

    if (!response.ok) {
      throw new Error("Products API failed");
    }

    const products =
      await response.json();

    box.innerHTML = "";

    if (!products || products.length === 0) {
      box.innerText = "Abhi koi product available nahi hai.";
      return;
    }

    products.forEach(product => {

      const div =
        document.createElement("div");

      div.className = "product";

      div.innerHTML = `
        <h3>${product.name}</h3>
        <p>Price: ₹${product.price}</p>
        <p>Stock: ${product.stock}</p>
        <p>Category: ${product.category}</p>

        <button
          type="button"
          onclick="addToCart(${product.id})">
          🛒 Add to Cart
        </button>
      `;

      box.appendChild(div);

    });

  } catch (error) {

    box.innerText =
      "Products load nahi ho rahe.";

  }
}


/* =========================
   ADD TO CART
========================= */

async function addToCart(productId) {
alert("Button chal raha hai");
  const savedUser =
    localStorage.getItem("desimartUser");

  if (!savedUser) {
    showMessage("Please login first.");
    return;
  }

  const user =
    JSON.parse(savedUser);

  try {

    const response = await fetch(
      API + "/api/cart/" + user.id,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          productId: productId,
          quantity: 1
        })
      }
    );

    const data =
      await response.json();

    if (!response.ok) {

      showMessage(
        data.error || "Cart mein add nahi hua."
      );

      return;
    }

    showMessage(
      "Product cart mein add ho gaya! 🛒"
    );

    loadCart();

  } catch (error) {

    showMessage(
      "Cart server se connect nahi ho raha."
    );

  }
}


/* =========================
   LOAD CART
========================= */

async function loadCart() {

  const savedUser =
    localStorage.getItem("desimartUser");

  if (!savedUser) {
    return;
  }

  const user =
    JSON.parse(savedUser);

  const cartBox =
    document.getElementById("cart");

  const totalBox =
    document.getElementById("cartTotal");

  const checkoutButton =
    document.getElementById("checkoutButton");

  try {

    const response =
      await fetch(API + "/api/cart/" + user.id);

    if (!response.ok) {
      cartBox.innerText = "Cart abhi empty hai.";
      totalBox.innerText = "";
      checkoutButton.classList.add("hidden");
      return;
    }

    const cart =
      await response.json();

    cartBox.innerHTML = "";

    if (!cart || cart.length === 0) {

      cartBox.innerText =
        "Your cart is empty.";

      totalBox.innerText = "";

      checkoutButton.classList.add("hidden");

      return;
    }

    let total = 0;

    cart.forEach(item => {

      const div =
        document.createElement("div");

      div.className = "cart-item";

      const price =
        Number(item.price || 0);

      const quantity =
        Number(item.quantity || 1);

      const itemTotal =
        price * quantity;

      total += itemTotal;

      div.innerHTML = `
        <strong>
          ${item.name || "Product"}
        </strong>

        <p>Price: ₹${price}</p>

        <p>Quantity: ${quantity}</p>

        <p>Item Total: ₹${itemTotal}</p>

        <button
          type="button"
          class="danger small-btn"
          onclick="removeFromCart(${item.productId})">
          Remove
        </button>
      `;

      cartBox.appendChild(div);

    });

    totalBox.innerText =
      "Total: ₹" + total;

    checkoutButton.classList.remove("hidden");

  } catch (error) {

    cartBox.innerText =
      "Cart load nahi ho raha.";

    totalBox.innerText = "";

    checkoutButton.classList.add("hidden");

  }
}


/* =========================
   REMOVE FROM CART
========================= */

async function removeFromCart(productId) {

  const savedUser =
    localStorage.getItem("desimartUser");

  if (!savedUser) {
    return;
  }

  const user =
    JSON.parse(savedUser);

  try {

    const response =
      await fetch(
        API + "/api/cart/" +
        user.id +
        "/" +
        productId,
        {
          method: "DELETE"
        }
      );

    if (!response.ok) {

      showMessage(
        "Cart item remove nahi hua."
      );

      return;
    }

    showMessage(
      "Product cart se remove ho gaya."
    );

    loadCart();

  } catch (error) {

    showMessage(
      "Cart server se connect nahi ho raha."
    );

  }
}


/* =========================
   CHECKOUT
========================= */

function checkout() {

  showMessage(
    "Checkout feature next step mein add karenge."
  );

}


/* =========================
   LOGOUT
========================= */

function logout() {

  localStorage.removeItem("desimartUser");

  document
    .getElementById("dashboard")
    .classList.add("hidden");

  document
    .getElementById("authSection")
    .classList.remove("hidden");

  document.getElementById("customerName").innerText = "";

  document.getElementById("products").innerHTML =
    "Products loading...";

  document.getElementById("cart").innerText =
    "Your cart is empty.";

  document.getElementById("cartTotal").innerText = "";

  document
    .getElementById("checkoutButton")
    .classList.add("hidden");

  showMessage("Logout successful.");

}


/* =========================
   AUTO LOGIN
========================= */

window.addEventListener("load", function() {

  const savedUser =
    localStorage.getItem("desimartUser");

  if (!savedUser) {
    return;
  }

  try {

    const user =
      JSON.parse(savedUser);

    if (!user || !user.id) {
      return;
    }

    document
      .getElementById("authSection")
      .classList.add("hidden");

    document
      .getElementById("dashboard")
      .classList.remove("hidden");

    document.getElementById("customerName").innerText =
      user.name || "";

    loadProducts();
    loadCart();

  } catch (error) {

    localStorage.removeItem("desimartUser");

  }

});

</script>

</body>
</html>
