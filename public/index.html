<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DesiMart Jharkhand</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #ff6b00;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #ff6b00;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>DesiMart Jharkhand</h1>
  <p>Jharkhand ka apna online market</p>
</header>

<div class="container">

  <div class="card">
    <h2>Customer Registration</h2>

    <input id="regName" type="text" placeholder="Apna naam">
    <input id="regMobile" type="tel" placeholder="Mobile number">
    <input id="regPassword" type="password" placeholder="Password">

    <button onclick="registerCustomer()">Register</button>
  </div>

  <div class="card">
    <h2>Customer Login</h2>

    <input id="loginMobile" type="tel" placeholder="Mobile number">
    <input id="loginPassword" type="password" placeholder="Password">

    <button onclick="loginCustomer()">Login</button>
  </div>

  <div id="message"></div>

</div>

<script>

const API = "https://desimart-jharkhand.onrender.com";

async function registerCustomer() {

  const name = document.getElementById("regName").value;
  const mobile = document.getElementById("regMobile").value;
  const password = document.getElementById("regPassword").value;

  try {

    const response = await fetch(API + "/api/users", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        mobile,
        password,
        role: "customer"
      })
    });

    const data = await response.json();

    document.getElementById("message").innerText =
      data.error || "Registration successful!";

  } catch (error) {

    document.getElementById("message").innerText =
      "Server se connection nahi ho raha.";

  }
}

async function loginCustomer() {

  const mobile = document.getElementById("loginMobile").value;
  const password = document.getElementById("loginPassword").value;

  try {

    const response = await fetch(API + "/api/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        mobile,
        password
      })
    });

    const data = await response.json();

    document.getElementById("message").innerText =
      data.message || data.error;

  } catch (error) {

    document.getElementById("message").innerText =
      "Server se connection nahi ho raha.";

  }
}

</script>

</body>
</html>
